name: CI

on:
  pull_request:
    paths: ['terraform/**', 'src/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['terraform/**', 'src/**', '.github/workflows/**']

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.6.6' }
      - name: Terraform Format Check
        working-directory: terraform/projects/demo-serverless
        run: terraform fmt -check -diff -recursive
      - name: Terraform Init
        working-directory: terraform/projects/demo-serverless
        run: terraform init -backend=false
      - name: Terraform Validate
        working-directory: terraform/projects/demo-serverless
        run: terraform validate
      - name: Unit tests placeholder
        run: echo "Add tests for Lambda here"
